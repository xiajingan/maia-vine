# H-04: Sprint CI — feature/library Sprint -> develop 的 L1 质量门禁
# Harness Engineering CICD.md

name: Code Quality

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  l1-quality:
    name: L1 Quality
    # PR 提交到 develop/main 时必须无条件触发静态质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-harness-runtime

      - name: Harness Python quality
        run: |
          uv run --project .harness/runtime harness validate-task-rules --ci
          uv run --project .harness/runtime harness mode-check

      - name: Validate environment registry
        run: uv run --project .harness/runtime harness env-check validate

      - name: Sync secrets declarations
        run: uv run --project .harness/runtime harness secrets-sync-check

      - name: Code Garden
        run: uv run --project .harness/runtime harness code-garden --ci

      - name: L1 quality score
        run: |
          case "$GITHUB_HEAD_REF" in
            sprint/*|library/*) SPRINT_ID="${GITHUB_HEAD_REF#*/}" ;;
            sprint-*|library-*) SPRINT_ID="${GITHUB_HEAD_REF#*-}" ;;
            *) echo "Unsupported Sprint branch: $GITHUB_HEAD_REF" >&2; exit 2 ;;
          esac
          test -n "$SPRINT_ID"
          uv run --project .harness/runtime harness quality-score --sprint "$SPRINT_ID" --level L1

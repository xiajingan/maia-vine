# H-04: Build Image — develop push 后构建 dev-<sha> 镜像，作为后续 promote 的源
# Harness Engineering CICD.md Build Once Deploy Many
#
# 触发：
#   - push:develop（每个 sprint 合入后构建一次）
#   - workflow_dispatch（手动 rebuild）
#
# 产物：ghcr.io/<repo>:dev-<sha>。staging.yml 与 release/* 流水线 retag 此镜像。

name: Build Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build dev-<sha>
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: ./.github/actions/setup-harness-runtime

      - name: Resolve tag
        id: tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push configured targets
        run: >-
          uv run --project .harness/runtime harness build-artifact
          --tag "${{ steps.tag.outputs.tag }}" --push
          --meta-out .harness/state/build-image-${{ steps.tag.outputs.tag }}.json

      - name: Upload immutable build evidence
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ steps.tag.outputs.tag }}
          path: .harness/state/build-image-${{ steps.tag.outputs.tag }}.json
          if-no-files-found: error

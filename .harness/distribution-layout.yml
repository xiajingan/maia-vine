version: 1

# Source paths belong to the Harness repository. Targets describe the installed
# project layout. Bootstrap and architecture tests consume this namespace and
# legacy-migration mapping; concrete asset selection lives in scaffold-assets.yml.
managed:
  runtime: .harness/runtime
  config: .harness/framework
  schemas: .harness/schemas
  rules: .harness/rules
  eslint: .harness/eslint
  templates: .harness/templates
  install_manifest: .harness/install-manifest.yml

generated:
  test_cases: docs/test-cases
  e2e: tests/e2e

fixed:
  codex: .codex
  agents: .agents
  github: .github
  gitlab: .gitlab

legacy_managed:
  - docs/SPRINT.md
  - docs/ASSIGNMENTS.md
  - docs/PRODUCT_SENSE.md
  - docs/DESIGN.md
  - docs/UI_DESIGN_SYSTEM.md

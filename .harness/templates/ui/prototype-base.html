<!DOCTYPE html>
<!--
  Harness HTML Prototype Base Template
  - 单文件、零外网依赖、可直接浏览器打开
  - 内联 tokens.css（与应用入口同源）保证视觉一致性
  - 只保留项目 impact_surfaces 声明的目标设备/Profile 与适用状态
  - 设计稿请保存至 docs/design-docs/prototypes/<feature>.html
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Feature] Prototype</title>
  <style>
    /* ===== Harness Tokens (inline copy of templates/ui/tokens.css) ===== */
    :root{
      --color-primary:#2563eb; --color-primary-hover:#1d4ed8; --color-primary-soft:#dbeafe; --color-on-primary:#ffffff;
      --color-success:#059669; --color-success-soft:#ecfdf5;
      --color-warning:#d97706; --color-warning-soft:#fff7ed;
      --color-danger:#dc2626;  --color-danger-soft:#fef2f2;
      --color-info:#4338ca;    --color-info-soft:#eef2ff;
      --color-bg:#f3f4f6; --color-surface:#ffffff; --color-surface-soft:#f9fafb;
      --color-border:#e5e7eb; --color-border-strong:#d1d5db;
      --color-text:#111827; --color-text-secondary:#374151; --color-text-muted:#6b7280; --color-text-disabled:#9ca3af;
      --font-sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem; --text-lg:1.125rem; --text-xl:1.25rem; --text-2xl:1.5rem;
      --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem;
      --radius-md:.5rem; --radius-lg:.75rem; --radius-xl:1rem; --radius-2xl:1.5rem; --radius-full:9999px;
      --shadow-sm:0 1px 2px rgba(17,24,39,.04),0 1px 3px rgba(17,24,39,.06);
      --shadow-md:0 4px 6px -1px rgba(17,24,39,.08),0 2px 4px -2px rgba(17,24,39,.06);
      --shadow-lg:0 10px 15px -3px rgba(17,24,39,.10),0 4px 6px -4px rgba(17,24,39,.08);
      --shadow-xl:0 20px 25px -5px rgba(17,24,39,.12),0 8px 10px -6px rgba(17,24,39,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);font-size:var(--text-sm);line-height:1.5}
    h1,h2,h3,h4,p{margin:0}
    .page{max-width:var(--container-target,100%);margin:0 auto;padding:var(--space-8) var(--space-6) calc(var(--space-8) * 2)}
    .lead{margin-top:var(--space-2);color:var(--color-text-muted)}
    .stack{display:grid;gap:var(--space-6);margin-top:var(--space-6)}
    .split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:var(--space-6)}
    .panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-2xl);padding:var(--space-5)}
    .artboard{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-5)}
    .board-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)}
    .caption{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:var(--space-1)}
    /* primitives */
    .btn{display:inline-flex;align-items:center;gap:.5rem;height:40px;padding:0 var(--space-4);border-radius:var(--radius-md);font-weight:500;font-size:var(--text-sm);border:1px solid transparent;cursor:pointer;transition:background var(--motion-fast,120ms) ease-out}
    .btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
    .btn-primary:hover{background:var(--color-primary-hover)}
    .btn-secondary{background:var(--color-surface);color:var(--color-text-secondary);border-color:var(--color-border-strong)}
    .btn-danger{background:var(--color-danger);color:#fff}
    .btn-ghost{background:transparent;color:var(--color-primary)}
    .input{height:40px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);background:var(--color-surface);color:var(--color-text)}
    .input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-soft)}
    .tag,.badge,.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:700;padding:4px 10px}
    .tag{background:var(--color-info-soft);color:var(--color-info)}
    .ok{background:var(--color-success-soft);color:var(--color-success)}
    .warn{background:var(--color-warning-soft);color:var(--color-warning)}
    .bad{background:var(--color-danger-soft);color:var(--color-danger)}
    .muted{color:var(--color-text-muted)}
    .skeleton{background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb);background-size:200% 100%;animation:sk 1.5s linear infinite;border-radius:var(--radius-full);height:12px}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>
  <div class="page">
    <h1>[Feature] Prototype</h1>
    <p class="lead">关联 User Story/AC：US-XXX。目标 Profile：[项目声明]。覆盖：[本次适用路径与状态]。</p>

    <!-- 1. 目标 Profile 主流程；按项目 token 设置容器和断点 -->
    <section class="panel" style="margin-top:var(--space-6)">
      <div class="board-title">
        <h2>1. Target Profile · [width/context]</h2>
        <span class="tag">[Affected view]</span>
      </div>
      <div class="artboard">
        <!-- 在此填入主路径设计 -->
        <p class="muted">在此放置桌面端主路径与状态板。</p>
        <div style="display:flex;gap:var(--space-3);margin-top:var(--space-4)">
          <button class="btn btn-primary">主操作</button>
          <button class="btn btn-secondary">次操作</button>
          <button class="btn btn-ghost">跳过</button>
        </div>
      </div>
    </section>

    <!-- 2. 适用状态证据：复制 artboard 只覆盖 UI_DESIGN_SYSTEM §5 判定为适用的状态 -->
    <section class="panel">
      <div class="board-title"><h2>2. Applicable states</h2></div>
      <div class="split">
        <div class="artboard"><h3>[S-ID · 状态]</h3><p class="caption">[触发依据、画面与恢复/下一动作]</p></div>
      </div>
    </section>
  </div>
</body>
</html>

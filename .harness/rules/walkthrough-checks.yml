# walkthrough-checks.yml — 产品走查 4 维结构化检查清单
# 对应规范：docs/PRODUCT_ACCEPTANCE.md 走查维度章节。
# 消费者：acceptance_record.py（生成指南 / 计分）、harness-review 子 Agent。
# 修改此文件即修改走查标准，无需改脚本。

version: "1.1"

# 4 维走查 = F (功能) + U (适用 UI) + P (产品决策) + X (体验)
# 每项：默认严重级别 = critical | major | minor | observation
# 实际走查结果由 Boss 确定严重级；默认值用于走查指南生成的权重排序。

dimensions:
  F:
    label: "PRD 功能符合性"
    spec: "docs/PRODUCT_ACCEPTANCE.md"
    checks:
      - { id: "F-01", title: "主路径完整", criterion: "按 PRD 用户流程逐步执行无阻断", default: major, applicability: required }
      - { id: "F-02", title: "边界行为覆盖", criterion: "PRD 纳入范围的真实边界和恢复行为符合 AC", default: major, applicability: required }
      - { id: "F-03", title: "契约完整性", criterion: "本次变化的字段/输入输出与 PRD 一致", default: major, applicability: required }
      - { id: "F-04", title: "状态适用性", criterion: "本次变化可达且用户需处理的状态均有正确行为", default: major, applicability: required }
      - { id: "F-05", title: "默认值策略", criterion: "与 PRD 一致，体现产品策略", default: minor, applicability: required }
      - { id: "F-06", title: "文案准确性", criterion: "与 PRD 定义一致", default: minor, applicability: required }
      - { id: "F-07", title: "条件化埋点", criterion: "PRD 已定义的埋点正确触发；未定义时不要求", default: minor, applicability: conditional, applies_when: {impact_surfaces: [analytics], project_types: [frontend, fullstack]} }
      - { id: "F-08", title: "质量属性", criterion: "PRD/Architecture 对本次声明的指标与风险验证通过", default: major, applicability: required }

  U:
    label: "UI 设计符合性"
    spec: "docs/DESIGN.md"
    checks:
      - { id: "U-01", title: "受影响页面流", criterion: "PRD 影响范围内页面已实现，导航与设计证据一致；无 UI 变化时不适用", default: major, applicability: conditional, applies_when: {impact_surfaces: [ui, frontend, routing, responsive, state-machine], project_types: [frontend, fullstack]} }
      - { id: "U-02", title: "视觉层级", criterion: "信息层级与设计一致", default: minor, applicability: conditional, applies_when: {impact_surfaces: [ui, responsive], project_types: [frontend, fullstack]} }
      - { id: "U-03", title: "布局与间距", criterion: "关键布局与项目 token/设计对照一致", default: minor, applicability: conditional, applies_when: {impact_surfaces: [ui, responsive], project_types: [frontend, fullstack]} }
      - { id: "U-04", title: "组件状态", criterion: "本次变化直接影响的可达组件状态有设计与实现证据", default: major, applicability: conditional, applies_when: {impact_surfaces: [ui, frontend, state-machine], project_types: [frontend, fullstack]} }
      - { id: "U-05", title: "响应式", criterion: "项目目标设备/Profile 的受影响断点正确", default: major, applicability: conditional, applies_when: {impact_surfaces: [responsive], project_types: [frontend, fullstack]} }
      - { id: "U-06", title: "动效", criterion: "设计已定义的必要动效与实现一致；未定义时不要求", default: minor, applicability: conditional, applies_when: {impact_surfaces: [ui], project_types: [frontend, fullstack]} }
      - { id: "U-07", title: "Design Token", criterion: "可追溯到 token，无硬编码样式", default: minor, applicability: conditional, applies_when: {impact_surfaces: [ui, frontend], project_types: [frontend, fullstack]} }
      - { id: "U-08", title: "业务优先级", criterion: "视觉重点、可执行动作和关键后果符合项目策略与 PRD", default: major, applicability: conditional, applies_when: {impact_surfaces: [ui, frontend], project_types: [frontend, fullstack]} }

  P:
    label: "产品决策符合性"
    spec: "docs/PRODUCT_SENSE.md"
    scoring: "五项产品决策质量独立评分，均分 ≥ 4/5 通过"
    checks:
      - { id: "P-1", title: "场景与结果保真", criterion: "实际行为保持 Story 的使用者、触发、约束和可观察结果", default: major, applicability: required }
      - { id: "P-2", title: "最小充分范围", criterion: "没有无 AC/风险来源的功能、步骤或系统复杂度", default: major, applicability: required }
      - { id: "P-3", title: "项目策略一致", criterion: "与 USER_STORIES.md 声明的适用产品策略一致，并接受其代价", default: major, applicability: required }
      - { id: "P-4", title: "状态与行动清晰", criterion: "用户理解当前状态、可执行动作和关键后果", default: minor, applicability: required }
      - { id: "P-5", title: "验收与证据", criterion: "Story/AC、实现行为和实际观察双向追溯", default: major, applicability: required }

  X:
    label: "用户体验符合性"
    spec: "docs/PRODUCT_SENSE.md"
    checks:
      - { id: "X-01", title: "认知负担", criterion: "只呈现当前任务必需决策，专业用户必需控制项未被过度隐藏", default: minor, applicability: required }
      - { id: "X-02", title: "反馈及时明确", criterion: "项目指标范围内反馈当前动作、进度或结果", default: major, applicability: required }
      - { id: "X-03", title: "恢复与可逆性", criterion: "真实失败和高风险操作具有与风险匹配的恢复、确认或证据", default: major, applicability: required }
      - { id: "X-04", title: "一致性", criterion: "同一语义复用项目既有交互、组件和文案模式", default: minor, applicability: required }
      - { id: "X-05", title: "文案可执行", criterion: "文案具体说明状态、原因或动作，不使用无信息泛语", default: minor, applicability: required }

# ─── 通过标准 ─────────────────────────────────────────────────────
# 由 src/mai_harness/runtime/commands/acceptance_record.py score 消费。
pass_rules:
  critical_max: 0
  major_max: 0
  minor_max: 5
  product_decision_min: 4  # P 维度产品决策质量均分 ≥ 4/5

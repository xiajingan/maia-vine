# task-rules.yml — 任务类型结构化约束
# H-19: 规范约束结构化 | H-21: 流程约束动态加载
#
# 本文件定义任务类型的约束（规范/工具/产出/验收/门控）。
# 执行协议见 SPRINT.md：Step 0 PRE-FLIGHT → Step 1 PLAN → Step 2 EXEC → Step 3 REVIEW。
# review_spec = Step 3 额外加载的审查规范（可选），与 acceptance 条件共同使用。
# REVIEW FAIL → 回到 Step 1 重新规划。

version: "2.0"

# 业务升级与数据迁移是 checkpoint 驱动的长任务。该对象投影 Python 安全下限，failure_phases 可扩展。
migration_execution_policy:
  business_upgrade_rollback: forbidden
  progress_model: checkpoint
  candidate_on_failure: preserve
  resume_from: last-committed-checkpoint
  data_rollback: forbidden
  failure_phases: [migration, quality-check, service-start, release]
  rollback_authority: explicit-human-release-rollback

# ─── Sprint 级 Preflight ─────────────────────────────────────────────────────
# Sprint 计划确认后、第一个任务执行前执行一次。失败时 ask_user 引导修复。

sprint_preflight:
  action: project.verify.preflight
  ttl_seconds: 1800
  on_failure: "ask_user 展示失败项 → 引导用户修复 → 重试至通过"

# planning contract v3 对需求输入的显式策略。stories 绑定 USER_STORIES；
# non-product-change 只允许没有产品行为变化的部署、维护、事故或内部治理工作。
sprint_requirement_modes:
  feature-sprint: [stories]
  control: [stories]
  maintenance: [stories, non-product-change]
  hotfix: [stories, non-product-change]
  library-sprint: [stories, non-product-change]
  deploy-sprint-test: [non-product-change]
  deploy-sprint-prod: [non-product-change]

# 下游 attempt 的直接产物输入投影。仅当依赖闭包中存在所列生产者时启用；
# 没有技术方案任务的 maintenance/hotfix 保留显式最近依赖，不虚构设计任务。
# Sprint Gate 仍验证完整依赖闭包，因此上游需求/PRD 漂移会经技术方案 attempt 阻断 Coding。
task_input_projections:
  code: [backend-design, frontend-design]
  library-code: [library-design]

# Feature planning contract v2/v3 的影响面到设计任务/facet 映射。Runtime 在 activate 前
# 要求计划任务集合与此映射精确一致：未声明影响面不能多做设计，已声明也不能省略。
impact_surface_requirements:
  existing-boundaries-only: {tasks: [], facets: {}}
  ui: {tasks: [design, frontend-design], facets: {}}
  frontend: {tasks: [frontend-design], facets: {}}
  backend: {tasks: [backend-design], facets: {}}
  data: {tasks: [backend-design], facets: {backend-design: [data]}}
  external-integration: {tasks: [backend-design], facets: {backend-design: [integration]}}
  concurrency: {tasks: [backend-design], facets: {backend-design: [concurrency]}}
  backend-security: {tasks: [backend-design], facets: {backend-design: [security]}}
  observability: {tasks: [backend-design], facets: {backend-design: [observability]}}
  shared-capability: {tasks: [backend-design], facets: {backend-design: [shared-capability]}}
  routing: {tasks: [frontend-design], facets: {frontend-design: [routing]}}
  frontend-performance: {tasks: [frontend-design], facets: {frontend-design: [performance]}}
  analytics: {tasks: [frontend-design], facets: {frontend-design: [analytics]}}
  frontend-security: {tasks: [frontend-design], facets: {frontend-design: [security]}}
  responsive: {tasks: [design, frontend-design], facets: {frontend-design: [responsive]}}
  state-machine: {tasks: [frontend-design], facets: {frontend-design: [state-machine]}}

# 单一任务权限矩阵。未登记任务默认拒绝，避免新增任务失败开放。
mode_task_capabilities:
  standalone: [infra, product, design, backend-design, frontend-design, dependency-change, code, test-case-gen, quality, pr, product-acceptance, sprint-close, library-design, library-code, library-contract, library-quality, library-package, library-delivery, library-close, library-pr, observe, promote-prep, build-image, promote-test, integration, release-prep, migration-design, regression, release-approval, prod-deploy, hotfix-init, back-merge]
  managed: [infra, product, design, backend-design, frontend-design, dependency-change, code, test-case-gen, quality, pr, product-acceptance, sprint-close, library-design, library-code, library-contract, library-quality, library-package, library-delivery, library-close, library-pr]
  control: [managed-project-check, assignment-dispatch, assignment-status, delivery-verify, release-compose, test-deploy, test-integration, integration-finding, release-promote, release-rollback]

# Sprint 类型与任务能力矩阵。Sprint 计划必须显式声明 `sprint_type:`；未登记类型和任务默认拒绝。
sprint_type_task_capabilities:
  feature-sprint: [infra, product, design, backend-design, frontend-design, dependency-change, code, test-case-gen, promote-prep, build-image, promote-test, integration, quality, pr, product-acceptance, sprint-close]
  deploy-sprint-test: [promote-prep, build-image, promote-test, integration]
  deploy-sprint-prod: [release-prep, migration-design, regression, release-approval, prod-deploy, back-merge, observe]
  hotfix: [hotfix-init, code, quality, prod-deploy, back-merge, observe]
  control: [managed-project-check, assignment-dispatch, assignment-status, delivery-verify, release-compose, test-deploy, test-integration, integration-finding, release-promote, release-rollback]
  maintenance: [infra, dependency-change, code, test-case-gen, quality, product-acceptance, pr, sprint-close]
  library-sprint: [library-design, library-code, library-contract, library-quality, library-package, library-delivery, library-close, library-pr]

# 流程顺序真源。任务必须按阶段递增；同一阶段可并行或按条件选择，未列入当前 Sprint 的可选任务不构成前置。
sprint_type_sequences:
  # UI 与前后端技术方案按任务真实影响面选择；optional+require=all 表示“未选择可跳过，已列入的全部完成”。
  feature-sprint: [{tasks: [infra]}, {tasks: [product]}, {tasks: [design], optional: true}, {tasks: [backend-design, frontend-design], require: all, optional: true}, {tasks: [dependency-change], optional: true}, {tasks: [code]}, {tasks: [test-case-gen]}, {tasks: [promote-prep], optional: true}, {tasks: [build-image], optional: true}, {tasks: [promote-test], optional: true}, {tasks: [integration], optional: true}, {tasks: [quality]}, {tasks: [product-acceptance]}, {tasks: [sprint-close], terminal_candidates: [sprint-close]}, {tasks: [pr]}]
  deploy-sprint-test: [{tasks: [promote-prep], optional: true}, {tasks: [build-image]}, {tasks: [promote-test]}, {tasks: [integration], terminal_candidates: [integration]}]
  deploy-sprint-prod: [{tasks: [release-prep]}, {tasks: [migration-design, regression], require: all}, {tasks: [release-approval]}, {tasks: [prod-deploy]}, {tasks: [back-merge]}, {tasks: [observe], terminal_candidates: [observe]}]
  hotfix: [{tasks: [hotfix-init]}, {tasks: [code]}, {tasks: [quality]}, {tasks: [prod-deploy]}, {tasks: [back-merge]}, {tasks: [observe], terminal_candidates: [observe]}]
  control: [{tasks: [managed-project-check]}, {tasks: [assignment-dispatch]}, {tasks: [assignment-status]}, {tasks: [delivery-verify]}, {tasks: [release-compose]}, {tasks: [test-deploy]}, {tasks: [test-integration]}, {tasks: [integration-finding, release-promote], require: any, terminal_candidates: [release-promote]}, {tasks: [release-rollback], terminal_candidates: [release-rollback]}]
  maintenance: [{tasks: [infra]}, {tasks: [dependency-change], optional: true}, {tasks: [code]}, {tasks: [test-case-gen]}, {tasks: [quality]}, {tasks: [product-acceptance]}, {tasks: [sprint-close], terminal_candidates: [sprint-close]}, {tasks: [pr]}]
  library-sprint: [{tasks: [library-design]}, {tasks: [library-code]}, {tasks: [library-quality]}, {tasks: [library-package]}, {tasks: [library-contract]}, {tasks: [library-delivery]}, {tasks: [library-close], terminal_candidates: [library-close]}, {tasks: [library-pr]}]

# Review 的责任域回退路线。owner_tasks 从当前 Sprint 的对应阶段重新开始；transfer_to 表示
# 当前流程没有合法责任任务，必须把问题转入新 Sprint，禁止临时塞入不属于该流程的任务。
scope_conflict_routes:
  feature-sprint:
    story: {owner_tasks: [product]}
    product: {owner_tasks: [product]}
    design: {owner_tasks: [design]}
    technical-design: {owner_tasks: [backend-design, frontend-design]}
  maintenance:
    story: {owner_tasks: [code]}
    product: {transfer_to: feature-sprint}
    design: {transfer_to: feature-sprint}
    technical-design: {transfer_to: feature-sprint}
  hotfix:
    story: {owner_tasks: [code]}
    product: {transfer_to: feature-sprint}
    design: {transfer_to: feature-sprint}
    technical-design: {transfer_to: feature-sprint}
  library-sprint:
    story: {owner_tasks: [library-design]}
    product: {transfer_to: feature-sprint}
    design: {transfer_to: feature-sprint}
    technical-design: {owner_tasks: [library-design]}
  control:
    story: {owner_tasks: [assignment-dispatch]}
    product: {transfer_to: feature-sprint}
    design: {transfer_to: feature-sprint}
    technical-design: {transfer_to: feature-sprint}
  deploy-sprint-test:
    story: {transfer_to: feature-sprint}
    product: {transfer_to: feature-sprint}
    design: {transfer_to: feature-sprint}
    technical-design: {transfer_to: feature-sprint}
  deploy-sprint-prod:
    story: {transfer_to: feature-sprint}
    product: {transfer_to: feature-sprint}
    design: {transfer_to: feature-sprint}
    technical-design: {transfer_to: feature-sprint}

sprint_type_mode_capabilities:
  standalone: [feature-sprint, deploy-sprint-test, deploy-sprint-prod, hotfix, maintenance, library-sprint]
  managed: [feature-sprint, maintenance, library-sprint]
  control: [control]

sprint_type_project_types:
  feature-sprint: [backend, fullstack, frontend]
  deploy-sprint-test: [backend, fullstack, frontend]
  deploy-sprint-prod: [backend, fullstack, frontend]
  hotfix: [backend, fullstack, frontend]
  control: [backend, fullstack, frontend]
  maintenance: [backend, fullstack, frontend]
  library-sprint: [library]

# Sprint 生命周期策略真源。Runtime 根据该策略和 Git 实际状态创建、检查工作区；
# Feature/Maintenance/Hotfix 不允许退回当前 HEAD 或主工作区执行。
sprint_type_policies:
  feature-sprint: {worktree: required, base: development, branch_prefix: "sprint/"}
  maintenance: {worktree: required, base: development, branch_prefix: "sprint/"}
  hotfix: {worktree: required, base: production, branch_prefix: "hotfix/"}
  deploy-sprint-test: {worktree: forbidden, base: development, branch_prefix: ""}
  deploy-sprint-prod: {worktree: forbidden, base: test, branch_prefix: ""}
  control: {worktree: forbidden, base: development, branch_prefix: ""}
  library-sprint: {worktree: required, base: development, branch_prefix: "library/"}

# Sprint 交付策略与终态 outcome 门禁的唯一真源。terminal_tasks 中任一任务 Review 前，
# 必须存在绑定当前 planning contract 且覆盖全部验收条件的 outcome evidence receipt。
delivery_strategies:
  domain-bootstrap: {observable_outcomes: [user-interaction, business-flow, external-interface, data-model, consumer-contract]}
  vertical-slice: {observable_outcomes: [user-interaction, business-flow, external-interface, data-model]}
  consumer-capability: {observable_outcomes: [consumer-contract, external-interface]}
  deployment: {observable_outcomes: [deployment, operational-control]}
  refactor: {observable_outcomes: [behavior-preservation], required_outcomes: [behavior-preservation]}
  remediation: {observable_outcomes: [user-interaction, business-flow, external-interface, data-model, consumer-contract, deployment, operational-control, behavior-preservation]}
  governance: {observable_outcomes: [governance-decision, operational-control]}

sprint_delivery_contracts:
  feature-sprint: {strategies: [domain-bootstrap, vertical-slice, refactor, remediation], terminal_tasks: [sprint-close], outcome_producer: boss-signoff}
  maintenance: {strategies: [vertical-slice, refactor, remediation], terminal_tasks: [sprint-close], outcome_producer: boss-signoff}
  library-sprint: {strategies: [domain-bootstrap, consumer-capability, refactor, remediation], terminal_tasks: [library-close], outcome_producer: task-review}
  deploy-sprint-test: {strategies: [deployment], terminal_tasks: [integration], outcome_producer: task-review}
  deploy-sprint-prod: {strategies: [deployment], terminal_tasks: [observe], outcome_producer: task-review}
  hotfix: {strategies: [remediation], terminal_tasks: [observe], outcome_producer: task-review}
  control: {strategies: [governance, deployment], terminal_tasks: [release-promote, release-rollback], outcome_producer: task-review}

# ─── 任务类型规则 ───────────────────────────────────────────────

tasks:
  managed-project-check:
    label: "管理工程检查"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [filesystem, vcs], deny: [modify-managed-source]}
    prerequisites: [control-mode, registered-managed-projects]
    execute: {action: control.projects.check}
    outputs: {path: ".harness/state/control/managed-project-validation.json"}
    acceptance: [registered-projects-valid, reciprocal-identity-valid, dependency-graph-acyclic]
  assignment-dispatch:
    label: "任务单分发"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [filesystem], deny: [modify-managed-source, trigger-managed-agent]}
    prerequisites: [USER_STORIES.md 中有对应 Control Story, managed-project-check done]
    inputs: [USER_STORIES.md, ARCHITECTURE.md, config/managed-projects.yml]
    execute: {action: control.assignment.dispatch, parameters: [manifest]}
    outputs: {path: ".harness/state/assignments/idempotency/"}
    acceptance: [story-reference-valid, schema-valid, idempotent, target-authorized, file-only-no-trigger]
  assignment-status:
    label: "任务单状态"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [filesystem], deny: [modify-managed-source, trigger-managed-agent]}
    prerequisites: [assignment-dispatch done]
    execute: {action: control.assignment.status}
    outputs: {path: ".harness/state/control/assignment-status.json"}
    acceptance: [local-authority-preserved, active-read-only, audit-recorded]
  delivery-verify:
    label: "交付单验证"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [filesystem, artifact-store], deny: [floating-artifact]}
    execute: {action: control.delivery.verify, parameters: [manifest]}
    outputs: {path: ".harness/state/control/delivery-verifications/"}
    acceptance: [immutable-artifacts, quality-passed, supply-chain-verified, manifest-digest-bound]
  release-compose:
    label: "系统发布组合"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [filesystem], deny: [floating-artifact]}
    execute: {action: control.release.compose, parameters: [release_id, deliveries]}
    outputs: {path: ".harness/state/releases/"}
    acceptance: [all-required-deliveries, dependency-order-valid, immutable-combination]
  test-integration:
    label: "Test 集成验证"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [kubernetes, playwright, observability], deny: [modify-managed-source]}
    prerequisites: [test-deploy done]
    execute: {action: control.integration.test, parameters: [manifest]}
    outputs: {path: ".harness/state/releases/"}
    acceptance: [test-environment-verified, system-e2e-passed]
  test-deploy:
    label: "Test 集成部署"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [kubernetes, filesystem], deny: [modify-managed-source]}
    prerequisites: [release-compose done]
    execute: {action: control.test.deploy, parameters: [manifest]}
    outputs: {path: ".harness/state/deployments/"}
    acceptance: [context-verified, namespace-allowlisted, immutable-release-used]
  integration-finding:
    label: "集成问题固化"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [filesystem, network], deny: [modify-managed-source]}
    execute: {action: control.integration.finding, parameters: [manifest, summary, project, evidence]}
    outputs: {path: ".harness/state/findings/"}
    acceptance: [release-identified, evidence-attached, suspected-projects-recorded]
    upstream_outcome: {task: test-integration, statuses: [blocked, failed, 失败], require_action_evidence: true}
  release-promote:
    label: "系统发布提升"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [kubernetes, artifact-store], deny: [floating-artifact]}
    execute: {action: control.release.promote, parameters: [manifest]}
    outputs: {path: ".harness/state/releases/"}
    acceptance: [test-verified, same-artifact-combination]
    upstream_outcome: {task: test-integration, statuses: [done, 完成, 通过]}
  release-rollback:
    label: "系统发布回滚"
    gate: L1
    allowed_modes: [control]
    tools: {allow: [kubernetes, artifact-store], deny: [floating-artifact]}
    blocking: "仅当人员在当前主交互中明确要求发布回滚后，以 release-authorization challenge → 运行时 HMAC 交互证明（15 分钟内）→ issue 签发一次性 receipt"
    execute: {action: control.release.rollback, parameters: [manifest, authorization]}
    outputs: {path: ".harness/state/releases/"}
    acceptance: [explicit-human-authorization-valid, previous-stable-release-used, audit-recorded]
    upstream_outcome: {task: release-promote, statuses: [done, completed, 完成, blocked, failed, 失败], require_action_evidence: true}
  infra:
    label: "环境搭建"
    spec: "ARCHITECTURE.md"
    gate: L1  # 仅通知
    allowed_project_types: [backend, fullstack, frontend]
    tools:
      allow: [file-rw, search, bash, sub-agent]
      deny: [modify-specs]
    prerequisites: []
    outputs:
      path: "项目根目录"
      artifacts: ["项目骨架", "CI/CD 配置", "Docker 配置"]
    acceptance: ["项目脚手架与 ARCHITECTURE.md 一致"]
    acceptance_by_project_type:
      backend: ["config/harness.yml 登记的后端构建、lint、类型检查和单元测试通过"]
      fullstack: ["config/technology.yml 对应的前后端必需命令全部可执行并通过"]
      frontend: ["config/technology.yml 对应的前端必需命令全部可执行并通过"]

  product:
    label: "产品设计"
    spec: "PRODUCT_SENSE.md"
    gate: L1  # 仅通知（Review 已保障质量）
    tools:
      allow: [file-rw, search, explore]
      deny: [bash, modify-code]
    prerequisites: ["USER_STORIES.md 中有对应 Story"]
    outputs:
      path: "docs/product-specs/"
      artifacts: ["PRD 文档"]
      index: "docs/product-specs/index.md"
    acceptance:
      - "Story 场景内核、约束、非目标和 AC 已准确回读，假设未伪装成事实"
      - "PRD 仅包含满足 AC 或明确 Architecture 风险所需的最小产品增量；每个范围项均绑定有效来源，新增/修改/删除及新增复杂度说明必要性"
      - "PRD 的最小范围与追溯矩阵由机器校验：Scope ID 唯一，Scope Key/模块/页面与当前 Task/Run 索引逐行一致，范围动作与转译枚举合法，完整覆盖 source_stories，产品行为与验收观察具有实质内容"
      - "PRD 影响范围与 planning contract impact_surfaces 一致；发现新增影响面时先 amend，再进入后续任务"
      - "产品作用域索引绑定文档 SHA-256 与当前 Task/Run；Exec 登记 draft，Review PASS 后 Runtime 发布 verified、处理 Supersedes 并生成不可变 publication receipt"

  design:
    label: "UI 设计"
    spec: "DESIGN.md"
    specs: ["DESIGN.md", "UI_DESIGN_SYSTEM.md"]  # H-21: plan/exec 应同时加载视觉规范单一源
    gate: L1  # 仅通知（Review 已保障质量）
    allowed_project_types: [fullstack, frontend]
    tools:
      allow: [file-rw, search, explore, frontend-design, canvas-design]
      deny: [bash, modify-code]
    prerequisites: ["product 任务完成"]
    outputs:
      path: "docs/design-docs/"
      artifacts: ["设计文档", "HTML 原型或 PNG 设计稿"]
      index: "docs/design-docs/index.md"
    acceptance:
      - "PRD/AC 与受影响页面、状态和设计证据双向追溯"
      - "设计为满足行为结果的最小交互增量，新增页面/步骤/组件均有必要性"
      - "UI_DESIGN_SYSTEM.md §5 状态适用性已判断；本次变化直接影响的可达状态有证据"
      - "每个变更页面均有可对照的 HTML 原型、PNG 设计稿或未变化现状证据"
      - "修改既有页面含现状/目标对照，项目 token 与组件 Profile 未被旁路"
      - "HTML 原型基于 templates/ui/prototype-base.html，引用 templates/ui/tokens.css"
      - "设计文档含适用 Token 使用清单（UI_DESIGN_SYSTEM.md §8.3）"
      - "设计作用域索引绑定文档 SHA-256 与当前 Task/Run；Exec 登记 draft，Review PASS 后 Runtime 发布 verified、处理 Supersedes 并生成不可变 publication receipt"

  backend-design:
    label: "后端技术方案"
    spec: "TECH_BACKEND.md"
    gate: L1
    allowed_project_types: [backend, fullstack]
    tools:
      allow: [file-rw, search, explore]
      deny: [bash, modify-code]
    facets: [data, integration, concurrency, security, observability, shared-capability]
    default_facets: []
    prerequisites: ["product 完成"]
    outputs:
      path: "docs/tech-docs/"
      artifacts: ["后端技术方案"]
      index: "docs/tech-docs/index.md"
    acceptance:
      - "Story/AC、PRD、ARCHITECTURE.md 与技术变更双向追溯"
      - "选择成本最低的适用建模方式并服从项目 Architecture Profile，未机械套用固定分层或 DDD"
      - "技术方案声明 technical_design_contract_version: 1，并以二级章节完整填写来源与约束回读、现状与最小变更、建模与核心流程、契约与验证、风险/回退/未决项；Runtime 拒绝缺失、重复和空章节"
      - "技术作用域索引绑定文档 SHA-256 与当前 Task/Run；backend draft 由 Review PASS 发布并生成不可变 publication receipt，模块与表/API/组件可检索"
    acceptance_by_facet:
      data: ["数据所有权、不变量、事务边界、迁移与回退影响明确"]
      integration: ["外部契约、超时/失败语义、兼容性和验证明确"]
      concurrency: ["并发、幂等、重试或补偿由副作用与负载证据驱动，不默认绑定中间件"]
      security: ["新增信任边界、权限和敏感数据的主体/资源/动作/审计设计完整"]
      observability: ["新关键链路或失败模式复用 Provider，并定义必要日志/metric/span 与关联 ID"]
      shared-capability: ["公共技术契约与领域错误/事件/状态语义分离，Provider/消费者/版本契约明确"]

  frontend-design:
    label: "前端技术方案"
    spec: "TECH_FRONTEND.md"
    specs: ["TECH_FRONTEND.md", "UI_DESIGN_SYSTEM.md"]
    gate: L1
    allowed_project_types: [fullstack, frontend]
    tools:
      allow: [file-rw, search, explore]
      deny: [bash, modify-code]
    facets: [routing, performance, analytics, security, responsive, state-machine]
    default_facets: []
    # 无 UI 变化的前端状态/路由方案可直接继承 product；若列入 design，阶段顺序仍强制其先完成。
    prerequisites: ["product 完成"]
    outputs:
      path: "docs/tech-docs/"
      artifacts: ["前端技术方案"]
      index: "docs/tech-docs/index.md"
    acceptance:
      - "Story/AC、PRD/设计与组件、状态、契约和验证双向追溯"
      - "技术方案声明 technical_design_contract_version: 1，并以二级章节完整填写来源与约束回读、现状与最小变更、组件与状态所有权、契约与验证、风险/回退/未决项；Runtime 拒绝缺失、重复和空章节"
      - "状态具有单一真源和最近稳定拥有者，共享抽象具有真实消费者与稳定语义"
      - "技术栈与 config/technology.yml 一致，只应用匹配的 UI_DESIGN_SYSTEM.md Profile"
      - "技术作用域索引绑定文档 SHA-256 与当前 Task/Run；frontend draft 由 Review PASS 发布并生成不可变 publication receipt，模块与表/API/组件可检索"
    acceptance_by_facet:
      routing: ["新增/变化路由的 URL 状态、参数真源、鉴权和兼容影响明确"]
      performance: ["性能设计包含现状/预算/触发依据和浏览器验证，不使用无来源统一阈值"]
      analytics: ["埋点与 PRD 的行为假设或决策用途对应，不为模板完整性采集"]
      security: ["新增输入、富文本、权限或敏感数据显示明确前后端责任和验证"]
      responsive: ["受影响目标设备和断点来自项目 Profile，变化有设计与浏览器证据"]
      state-machine: ["复杂状态转换包含事件、守卫、终态和恢复，简单状态未过度建模"]

  code:
    label: "代码生成"
    spec-backend: "CODING_BACKEND.md"
    spec-frontend: "CODING_FRONTEND.md"
    specs-frontend: ["CODING_FRONTEND.md", "UI_DESIGN_SYSTEM.md"]  # 前端实现需 token 与组件模式
    review_spec: "CODE_REVIEW.md"  # Step 3 REVIEW 额外加载此规范做 6 维代码评审
    gate: L1
    allowed_project_types: [backend, fullstack, frontend]
    facets: [backend, frontend, user-journey, ui, migration, security, concurrency]
    default_facets_by_project_type:
      backend: [backend]
      fullstack: [backend, frontend, user-journey, ui]
      frontend: [frontend, user-journey, ui]
    tools:
      allow: [file-rw, search, bash, sub-agent, chrome-devtools, webapp-testing]
      deny: [modify-specs]
    infra_action: project.verify.preflight
    outputs:
      path: "src/ 或 web/src/ 或 scripts/ 或 deploy/ 或 tests/e2e/scenarios/"
      artifacts: ["可运行代码", "单元测试", "E2E 场景用例", "评审报告"]
    acceptance:
      - "覆盖率 ≥ 80%"
      - "harness verify health 通过"
      - "Step 3 代码评审：6 维全检，0 Critical + 0 Major + Minor ≤ 5"
    acceptance_by_facet:
      backend: ["config/harness.yml 登记的后端静态检查、单元测试和集成测试通过"]
      frontend: ["config/technology.yml 对应的前端必需命令通过"]
      user-journey: ["新增或变更用户链路的项目级 E2E 命令通过"]
      ui: ["前端 UI Contract、Token 和 prototype-parity 门禁通过"]

  dependency-change:
    label: "同步公共依赖迭代"
    spec: "ASSIGNMENTS.md"
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    allowed_project_types: [backend, fullstack, frontend]
    tools: {allow: [file-rw, search, bash], deny: [copy-provider-source, floating-artifact]}
    prerequisites: []
    outputs: {path: ".harness/state/dependency-sessions/", artifacts: ["已完成的 coordinated dependency session"]}
    acceptance:
      - "Provider 在独立 worktree 和 Library Sprint 中完成"
      - "不可变 package candidate 通过消费者契约"
      - "Delivery、精确锁文件与 adoption 证据一致"

  library-design:
    label: "公共包技术方案"
    spec: "TECH_LIBRARY.md"
    gate: L1
    allowed_project_types: [library]
    tools: {allow: [file-rw, search, explore], deny: [modify-code]}
    prerequisites: []
    outputs:
      path: "docs/tech-docs/"
      artifacts: ["公共 API、兼容策略与消费者矩阵"]
      index: "docs/tech-docs/index.md"
    acceptance:
      - "能力 ID、公共/业务边界、版本兼容与废弃策略明确"
      - "受影响消费者及其契约命令完整登记"
      - "公共技术 envelope 与业务错误码、领域事件、状态值和 Repository 所有权分离"
      - "每个新增公开符号有真实消费者和契约验证，无推测性 API"
      - "技术作用域索引绑定文档 SHA-256 与当前 Task/Run；library draft 由 Review PASS 发布并生成不可变 publication receipt，模块与 API/组件可检索"

  library-code:
    label: "公共包实现"
    spec-backend: "CODING_BACKEND.md"
    review_spec: "CODE_REVIEW.md"
    gate: L1
    allowed_project_types: [library]
    tools: {allow: [file-rw, search, bash, sub-agent], deny: [modify-specs]}
    infra_action: project.verify.preflight
    outputs: {path: "src/", artifacts: ["公共包源码", "单元测试"]}
    acceptance:
      - "静态检查、类型检查和单元测试通过"
      - "公共 API 与 library-design 一致"
      - "0 Critical + 0 Major"

  library-contract:
    label: "公共包契约验证"
    spec: "CODE_REVIEW.md"
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    allowed_project_types: [library]
    tools: {allow: [file-rw, search, bash], deny: [modify-specs]}
    prerequisites: ["library-package 完成"]
    outputs: {path: ".harness/state/dependency-sessions/incoming/", artifacts: ["受影响消费者契约证据"]}
    acceptance:
      - "Library 单元/公共 API 检查已在 code 与 quality 阶段通过"
      - "当前 session 的消费者 contract 通过"
      - "破坏性变更已升级 major 或被拒绝"

  library-quality:
    label: "公共包质量"
    spec: "QUALITY_SCORE.md"
    gate: L1
    entry_action: project.quality.score
    allowed_project_types: [library]
    tools: {allow: [file-rw, search, bash], deny: [modify-specs]}
    prerequisites: ["library-code 完成"]
    infra_action: project.verify.preflight
    outputs: {path: "docs/test-reports/", artifacts: ["质量评分报告"]}
    acceptance:
      - "项目 command_groups.precommit 通过"
      - "覆盖率达到项目阈值"
      - "质量报告绑定 clean、完整的源码 commit"

  library-package:
    label: "公共包构建"
    gate: L1
    entry_action: project.library.package
    allowed_modes: [standalone, managed]
    allowed_project_types: [library]
    tools: {allow: [file-rw, search, bash], deny: [modify-specs, floating-artifact]}
    prerequisites: ["library-quality 完成"]
    outputs: {path: "dist/", artifacts: ["Build Once package、版本和 SHA-256"]}
    acceptance:
      - "package 由当前完整 Git commit 构建一次"
      - "版本、源码 commit 和 SHA-256 已写入 library-packages 状态证据"
      - "package source commit 与 PASS 的 Library quality 证据一致，且绑定质量证据 SHA-256"

  library-delivery:
    label: "公共包交付"
    gate: L1
    artifact_action: project.library.delivery.guard
    allowed_modes: [managed, standalone]
    allowed_project_types: [library]
    tools: {allow: [file-rw, artifact-store], deny: [modify-code, floating-artifact]}
    prerequisites: ["library-contract 完成"]
    outputs: {path: "docs/deliveries/", artifacts: ["不可变 dependency-package Delivery"]}
    acceptance:
      - "Delivery 绑定全部被满足的 Assignment 或 dependency session 摘要"
      - "供应链验证 receipt 有效"

  library-close:
    label: "公共包 Sprint 归档"
    spec: "SPRINT.md"
    gate: L1
    allowed_project_types: [library]
    tools: {allow: [file-rw, search, bash], deny: [modify-code]}
    prerequisites: ["library-delivery 完成"]
    outputs: {path: "docs/exec-plans/completed/", artifacts: ["已归档 Library Sprint"]}
    acceptance: ["全部 Library 任务完成且 Sprint 计划已归档"]

  library-pr:
    label: "公共包合并请求"
    gate: L1
    allowed_modes: [managed, standalone]
    allowed_project_types: [library]
    tools: {allow: [file-rw, search, bash], deny: [modify-code, modify-specs]}
    prerequisites: ["library-close 完成"]
    outputs: {path: "PR URL", artifacts: ["Library PR"]}
    acceptance:
      - "PR/MR 通过 harness pr-adapter 创建"
      - "远端 CI 与分支保护通过"

  test-case-gen:
    label: "测试用例生成"
    spec: "TEST_CASES.md"
    gate: L1
    tools:
      allow: [file-rw, search, explore]
      deny: [bash, modify-code]
    prerequisites: ["code 任务 Step 3 REVIEW 通过"]
    outputs:
      path: "docs/test-cases/"
      artifacts: ["测试用例 YAML（扁平化存放）", "E2E 场景实现", "用例索引"]
      index: "docs/test-cases/index.md"
    acceptance:
      - "每条 PRD 用户旅程至少 1 个 P0 用例"
      - "用例结构符合 TEST_CASES.md 模板"
      - "需要浏览器验证的 .yml 用例有对应的 tests/e2e/scenarios/*.spec.ts"
      - "新增/修改用例必须填写 introduced_in、last_modified_in、last_verified_in"
      - "涉及第三方/外部服务/媒体持久化的用户可见链路，用例集中至少 1 条声明 execution.mode: live"
      - "index.md 已更新"
    completion_checks:
      - "harness test-case-validator --sprint <N-name> --ci"

  quality:
    label: "测试质量评分"
    spec: "QUALITY_SCORE.md"
    entry_action: project.quality.score
    gate: L1
    tools:
      allow: [file-rw, search, bash, sub-agent, chrome-devtools, webapp-testing]
      deny: [modify-specs]
    prerequisites: ["test-case-gen 完成", "测试基础设施存在"]
    infra_action: project.verify.preflight
    outputs:
      path: "docs/test-reports/"
      artifacts: ["测试报告", "质量评分"]
      index: "docs/test-reports/index.md"
    acceptance:
      - "entry_action 退出码 = 0（总分 ≥ 95）"
      - "7 个评分维度全部执行；不适用维度按当前 project.type 规则处理"
      - "报告文件为 <N-name>-quality.md（非时间戳命名；<N-name> 已含 sprint- 前缀）"
      - "Architecture/PRD 对本次声明性能目标时，项目 producer 证据达标；未声明时该维度明确不适用"
    acceptance_by_project_type:
      backend: ["API 单元/集成、服务健康和项目登记的覆盖率证据完整"]
      fullstack: ["Playwright E2E 与 UI 还原度三项门禁通过", "截图和真实链路证据（若存在）已记录"]
      frontend: ["Playwright E2E 与 UI 还原度三项门禁通过", "截图和真实链路证据（若存在）已记录"]
    completion_checks:
      - "test -f docs/test-reports/<N-name>-quality.md"

  pr:
    label: "合并请求"
    gate: L1
    allowed_modes: [standalone, managed]
    tools:
      allow: [file-rw, search, bash, sub-agent]
      deny: [modify-specs, modify-code]
    # H-OPT v1.6: PR 后置至 product-acceptance 之后（GitLab CI 触发不稳定 + quality-score 已承担主校验）
    prerequisites: ["sprint-close done", "product-acceptance L3 通过（ask_user 确认记录）"]
    approval_artifact: "docs/acceptance-reports/<N-name>-boss-signoff.yml"
    artifact_action: project.acceptance.guard
    outputs:
      path: "PR URL"
      artifacts: ["PR 已创建", "全量检查通过"]
    acceptance:
      - "PR/MR 通过 harness pr-adapter 创建，不直接调用 gh/glab；GitLab 为权威 CI 时，MR 由 GitLab 流水线和保护分支规则决定能否合并"
      - "development 模式：PR/MR 从 sprint/N-xxx 到 develop"
      - "test 模式（config/harness.yml walkthrough_env=test）：PR/MR 从 sprint/N-xxx 到 develop，且已走查 commit_sha 也必须通过 MR 抵达 test"
      - "PR 标题符合 Conventional Commits"
      - "PR 描述包含：变更摘要、关联 User Story、测试结果、截图（前端）"
      - "config/harness.yml command_groups.precommit 与项目构建命令全部通过"
      - "合并后 sprint 分支已抵达目标远端 ref；Review Gate 通过后再从主工作区安全清理 worktree"
    acceptance_by_project_type:
      backend: ["项目登记的后端 lint、类型检查、测试与构建命令通过"]
      fullstack: ["config/technology.yml 对应的前后端全量检查、构建和 E2E 通过"]
      frontend: ["config/technology.yml 对应的前端检查、测试、构建和 E2E 通过"]
    manual_steps:
      - "Agent 使用 harness pr-adapter create 构造 PR/MR；GitLab push-options fallback 只能由 pr-adapter 内部封装，不得在任务中绕过适配器"
      - "缺少 GitLab CLI/CI 时，Agent 必须输出 MR URL + 本地全量检查证据，等待用户在 GitLab 手动确认"
      - "MR 合并后用户通过 ask_user 确认；Review Gate 验证远端包含关系后，再从主工作区执行 harness worktree destroy <id> --merged-into <remote-ref>"
    post_merge:
      - "走查偏差记录至 tech-debt-tracker.md（若有）"
    note: "每个 Sprint 必须包含一个 pr 任务。Sprint = PR 级别交付单元。pr 在 product-acceptance 之后执行。"

  product-acceptance:
    label: "产品走查"
    spec: "PRODUCT_ACCEPTANCE.md"
    gate: L3  # 必须审批 — BOSS 产品走查
    approval_artifact: "docs/acceptance-reports/<N-name>-boss-signoff.yml"
    approval_phase: review
    tools:
      allow: [file-rw, search, bash, chrome-devtools, webapp-testing]
      deny: [modify-code, modify-specs]
    # H-OPT v1.6: PR 后置后，product-acceptance 紧接 quality
    prerequisites: ["quality 通过（阈值由 config/harness.yml gates.quality_threshold 决定，默认 95）", "PRD + Sprint 实际列入的适用设计文档存在"]
    infra_action: project.verify.preflight
    outputs:
      path: "docs/acceptance-reports/"
      artifacts: ["走查报告", "走查指南"]
      index: "docs/acceptance-reports/index.md"
    readiness:
      quality_report:
        path: "docs/test-reports/<N-name>-quality.md"
        markers:
          - "结果: ✅ 达标"
    acceptance:
      - "产品决策质量目标 ≥ 4/5，Story/AC 与实际观察可追溯"
      - "走查指南已生成（<N-name>-walkthrough.md），含环境信息 + 变更对照 + 逐步操作 + 预期结果 + 证据占位"
      - "走查报告已生成（<N-name>-acceptance.md），用于记录 Boss 实际结果与结论"
    acceptance_by_project_type:
      backend: ["API 主路径、异常路径、权限和持久化验收完整"]
      fullstack: ["本 Sprint 有 UI 变化时执行适用 UI 走查和 prototype-vs-live 对照；无 UI 变化时记录 PRD 影响面依据", "用户/消费者主路径与适用持久化检查完整"]
      frontend: ["适用的四维走查完整，不可达或未触发检查项有范围依据", "prototype-vs-live 截图与版式检查覆盖本次变化"]
    blocking: "product-acceptance Review PASS 后 → 编排者使用 ask_user 阻塞等待 Boss 确认，并执行 harness acceptance-record approve|reject <N-name> 固化结果"

  sprint-close:
    label: "Sprint 归档"
    spec: "SPRINT.md"  # 闭环协议章节
    gate: L1
    allowed_modes: [standalone, managed]
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs, modify-code]
    prerequisites: ["product-acceptance L3 通过（ask_user 确认记录）"]
    approval_artifact: "docs/acceptance-reports/<N-name>-boss-signoff.yml"
    preflight_file_checks:
      - "docs/acceptance-reports/<N-name>-acceptance.md 必须存在"
      - "docs/acceptance-reports/<N-name>-walkthrough.md 必须存在"
    artifact_action: project.acceptance.guard
    steps:
      - "归档计划：docs/exec-plans/active/ → docs/exec-plans/completed/"
      - "更新 AGENTS.md 当前迭代指针"
      - "执行 harness requirements complete <N-name>，仅将本 Sprint 引用且不再被其他 active Sprint 使用的 Story 从 ready 更新为 done"
    acceptance:
      - "计划文件在 exec-plans/completed/"
      - "AGENTS.md 迭代指针已更新"
      - "requirements complete 成功并生成 Story 完成回执；non-product-change 返回 not-applicable"
      - "归档与 Story 状态变更已纳入当前 sprint 分支，等待 pr 任务合并；不得先销毁 worktree"

  # H-OPT v1.6: release 任务删除（被 deploy-sprint 概念替代，发布作为独立 Sprint 编排）
  # 旧定义已迁出。生产部署改由 prod-deploy 任务承担（见下方）。

  observe:
    label: "线上观测"
    spec: "OBSERVABILITY.md"
    gate: L1  # 仅通知
    tools:
      allow: [file-rw, search, bash, sub-agent]
      deny: [modify-code, modify-specs]
    prerequisites: ["prod-deploy 完成"]
    outputs:
      path: "docs/observability-reports/"
      artifacts: ["观测报告"]
      index: "docs/observability-reports/index.md"
    acceptance:
      - "适用性矩阵中的维度全部达标；不适用项说明理由"
      - "ARCHITECTURE.md 与本次技术方案声明的适用 SLO 全部达标"
      - "无 Critical 告警"

  # ─── CICD.md：CI/CD 任务类型 ────────────────────────────────

  promote-prep:
    label: "部署前置检查（test|prod）"
    spec: "CICD.md / config/deploy.yml"
    lifecycle: legacy-only
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs, modify-code]
    prerequisites:
      - "config/deploy.yml 存在（或旧 environments.yml 可被 deploy-config loader 兼容读取）"
    external_evidence:
      kind: sprint-signoffs
      field: source_sprints
      sprint_types: [deploy-sprint-test, deploy-sprint-prod]
    steps:
      - "harness promote-prep <env>"
    acceptance:
      - ".harness/state/promote-prep-<env>.json 写入 ready=true"
      - "deploy/<env>/docker-compose.yml 存在（docker 模式）或 cloud-native 占位被显式拒绝"
      - "required_secrets 全部声明，runtime 模板齐备"

  build-image:
    label: "镜像构建（部署 Sprint）"
    spec: "CICD.md / config/deploy.yml.build"
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs, modify-code]
    prerequisites:
      - "来源 commit 已固定；构建过程不读取目标环境 Secrets"
    external_evidence:
      kind: sprint-signoffs
      field: source_sprints
      sprint_types: [deploy-sprint-test]
      candidate_field: base_sha
      require_head_match: true
      require_source_ancestry: true
    steps:
      - "harness build-image --sprint <N-name> [--target <name>|all]"
    acceptance:
      - ".harness/images/*-<source-commit>.tar 产物存在，或 registry image digest 已登记"
      - ".harness/state/build-image-<N-name>.json success=true"

  promote-test:
    label: "提升至 Test 环境"
    spec: "CICD.md"
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs, modify-code]
    prerequisites:
      - "build-image 完成"
    infra_action: environment.test.prepare
    infra_cache: never
    artifact_action: project.promote-test.guard
    steps:
      - "harness deploy --env test --tag <commit-sha> --sprint <N-name> --task-id <task-id> --artifact <name=path> --artifact-sha256 <name=sha256:digest>"
      - "harness promote-test-receipt --sprint <N-name> --task-id <task-id>"
    acceptance:
      - ".harness/state/deploy-test-*.json 写入 success=true、readiness=passed、smoke=passed"
      - "部署 adapter 证据绑定不可变 commit、全部 artifact SHA-256 与目标 image digest"
      - "test 环境 deploy 健康检查通过"
      - ".harness/state/promote-test/<sprint>/<task-id>/<run-id>.json 绑定当前 attempt、build state、制品摘要和 deploy state"
      - "integration 作为后续独立任务执行，不得成为 promote-test 的循环前置"

  integration:
    label: "真实环境集成处理与验证"
    spec: "CICD.md / MIGRATION.md"
    gate: L1
    execution_protocol: agent
    review_protocol: agent-full
    execution_contract: integration-v1
    entry_action: project.integration.execute
    facets: [data, schema, environment, external, verification, performance, observability]
    default_facets: [verification]
    tools:
      allow: [file-rw, search, webapp-testing]
      deny: [modify-specs, modify-code, build-image, replace-delivery-artifact]
    prerequisites: ["promote-test deploy 成功"]
    infra_action: environment.test.check
    artifact_action: project.integration.guard
    outputs:
      path: "docs/test-reports/integration/"
      artifacts: ["<task-id>/receipt.yml 结构化执行回执", "<task-id>/ 操作前后证据", "checkpoint 或只读验证结果"]
    acceptance:
      - {id: integration.delivery-identity-bound, text: "处理前后 commit、镜像及制品 digest 保持为 promote-test 已登记的不可变交付身份"}
      - {id: integration.operation-audit-complete, text: "报告记录目标环境、选择的 facets、执行操作、作用范围、前后状态、失败与最终结果"}
      - {id: integration.final-health-passed, text: "完成处理后目标环境健康且所声明的最终验收结果全部通过"}
      - {id: integration.receipt-verified, text: "Review Gate 已验证结构化回执、producer、恢复策略、证据摘要及受保护工作区未变化"}
    acceptance_by_facet:
      data:
        - {id: integration.data-controlled, text: "数据清洗、修正或回填仅通过已评审 producer 执行，并记录作用范围、前后校验及 checkpoint"}
      schema:
        - {id: integration.schema-controlled, text: "DDL 仅执行已评审 migration producer，Schema 差异、幂等或续跑结果及 validator 证据完整"}
      environment:
        - {id: integration.environment-controlled, text: "环境修正仅通过已登记 adapter、命令或 runbook 执行，配置和运行状态变化可审计"}
      external:
        - {id: integration.external-verified, text: "真实外部系统连接、失败语义和业务结果完成验证"}
      verification:
        - {id: integration.verification-passed, text: "对部署后系统执行所声明的只读 API、页面、跨服务或 E2E 验证并通过"}
      performance:
        - {id: integration.performance-passed, text: "按计划声明的样本、窗口和阈值记录真实性能结果并通过"}
      observability:
        - {id: integration.observability-passed, text: "观察窗内无计划禁止的崩溃、重启、错误或 Critical 告警"}

  release-prep:
    label: "Release 资产准备"
    spec: "CICD.md"
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash, sub-agent]
      deny: [modify-specs, modify-code]
    prerequisites: ["纳入 release 的 sprint 全部 product-acceptance 通过"]
    external_evidence: {kind: sprint-signoffs, field: source_sprints}
    infra_action: environment.test.branch
    steps:
      - "harness release init <vX.Y.Z> --sprints s1,s2"
      - "harness release scaffold <vX.Y.Z>"
      - "harness release aggregate-quality <vX.Y.Z>"
    outputs:
      path: "deploy/release/<vX.Y.Z>/"
      artifacts: ["release-notes.md", "migrations/manifest.yml", "deploy/", "quality-summary.json"]
    acceptance:
      - "release-notes.md 八章节齐全（templates/release-notes.md）"
      - "migrations 校验：harness migration-check all deploy/release/<v>/migrations"
      - "observability 校验：harness observability-check validate"
      - "harness release pr <vX.Y.Z> 创建 release/* → main 的 PR"

  migration-design:
    label: "数据迁移设计"
    spec: "MIGRATION.md"
    gate: L1
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs, run-migration-on-prod]
    prerequisites: ["技术方案明确数据模型变更"]
    infra_action: release.directory.ensure
    outputs:
      path: "deploy/release/<vX.Y.Z>/migrations/"
      artifacts: ["NNN-slug.up.sql", "NNN-slug.down.sql", "manifest.yml"]
    acceptance:
      - "harness migration-check policy <dir> 通过"
      - "harness migration-check pair <dir> 通过"
      - "harness migration-check name <dir> 通过"
      - "harness migration-check dry-down <dir> 通过"
      - "harness migration-check idempotency <dir> 通过"

  regression:
    label: "全量回归 + 性能（L3）"
    spec: "CICD.md"
    gate: L1
    tools:
      allow: [file-rw, search, bash, webapp-testing]
      deny: [modify-specs]
    prerequisites: ["release-prep 完成", "release/* PR 已创建"]
    infra_action: environment.test.check
    outputs:
      path: "docs/test-reports/regression/"
    acceptance:
      - "全量回归通过"
      - "性能压测通过（项目阈值）"
      - "migration rehearse 通过：harness migration-check rehearse"

  release-approval:
    label: "Release 上线许可（L3）"
    spec: "CICD.md"
    gate: L3
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs, modify-code]
    prerequisites:
      - "regression 通过"
      - "release-notes.md / quality-summary.json 完整"
    infra_action: release.notes.exists
    blocking: "Boss 走查 release-notes 后通过 ask_user 阻塞确认；通过则执行 release.py approve 写 deploy/release/<v>/approval.yml，再 pr-adapter merge release/* → main"
    steps:
      - "harness release approve <vX.Y.Z> --by Boss --summary <一句话>"
    acceptance:
      - "deploy/release/<v>/approval.yml: decision=approved 已写入"
      - "release/* → main PR 已合并"

  prod-deploy:
    label: "生产部署"
    spec: "CICD.md"
    gate: L1
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-code-on-production, modify-specs]
    prerequisites: ["release-approval 通过", "main 已合并"]
    infra_action: environment.prod.check
    steps:
      - "harness migration-progress begin <release-id> --candidate-ref <candidate-data-ref>；每批提交 checkpoint"
      - "迁移、质量检查、服务启动与发布命令分别通过 harness migration-progress run <release-id> --phase <phase> -- <argv> 执行"
      - "harness deploy preflight-secrets --env prod"
      - "harness image-promote --from test-<sha> --to prod-<sha>"
      - "harness deploy --env prod --tag prod-<sha> --progress-id <release-id>"
      - "harness deploy watch --env prod --window 30m --progress-id <release-id>"
      - "harness back-merge --from main --to test,develop --reason release"
    acceptance:
      - "生产 deploy/promote 必须绑定 active progress state；迁移、质量检查、服务启动或发布失败时记录 fail，修复后显式 resume"
      - "健康窗口（30 min）通过"
      - "back-merge PR 已创建"
      - "无回滚"

  hotfix-init:
    label: "Hotfix 初始化"
    spec: "CICD.md"
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs]
    prerequisites: ["生产严重事故（P0/P1）"]
    infra_action: vcs.fetch.main
    steps:
      - "harness hotfix init <issue-id> --severity p0|p1"
    outputs:
      path: "sprints/hotfix-<issue-id>/PLAN.md"
    acceptance:
      - "hotfix/<issue-id> 分支已基于最近 prod tag 创建"
      - "计划模板含现象/根因/修复/验证/部署/回灌六章节"

  back-merge:
    label: "回灌主线"
    spec: "CICD.md"
    gate: L1
    execution_protocol: orchestrator
    review_protocol: artifact-only
    tools:
      allow: [file-rw, search, bash]
      deny: [modify-specs, modify-code]
    prerequisites: ["main 完成 release 或 hotfix 部署"]
    infra_action: vcs.fetch.release-branches
    steps:
      - "harness back-merge --from main --to test,develop --reason <release|hotfix-id>"
    acceptance:
      - "back-merge PR 已自动创建"
      - "无未解决冲突（冲突时停在 back-merge/* 分支由人工接手）"

# ─── 门控级别定义 ──────────────────────────────────────────────

gates:
  L1:
    label: "仅通知"
    action: "AI 完成后通知用户，无需等待确认，自动继续下一任务"
  L3:
    label: "必须审批"
    action: "AI 完成任务（Step 1→2→3）后，必须使用 ask_user 工具阻塞等待用户明确确认（通过/approved/继续）"
    enforcement: "编排者必须调用 ask_user 工具，禁止仅输出文字后自行继续"
    constraint: "禁止同一轮对话跨越 L3 阻断点。没有反馈 = 未通过。"
    preflight_check: "下游任务 Pre-Flight 必须验证 L3 产出物文件存在，文件不存在 = 未执行 = hard stop"

# ─── 派生规则 ──────────────────────────────────────────────────
# 注意：REVIEW FAIL 不走 spawn，而是在同一任务内 Step 1→2→3 重试。
# spawn_rules 只定义任务间的前向流转。

spawn_rules:
  # ─── control-sprint 流转 ────────────────────────────────────────────────
  # USER_STORIES 是需求输入；Assignment/Response/Delivery/Release 是派生产物。
  # “后续主动启动”是硬边界，不代表后台等待或自动唤醒。
  - from: managed-project-check
    to: [assignment-dispatch]
    condition: "Control Story 已确认目标 Managed；双向注册与依赖图校验通过"
  - from: assignment-dispatch
    to: [assignment-status]
    condition: "用户后续主动启动 Control Sprint 检查需求纳入结果"
  - from: assignment-status
    to: [delivery-verify]
    condition: "用户主动继续 Control Sprint，且所需 Managed 发布产出已存在"
  - from: delivery-verify
    to: [release-compose]
    condition: "全部必需交付、不可变摘要和契约校验通过"
  - from: release-compose
    to: [test-deploy]
    condition: "确定版本组合已生成"
  - from: test-deploy
    to: [test-integration]
    condition: "共享 Test 环境部署和身份校验通过"
  - from: test-integration
    to: [release-promote, integration-finding]
    condition: "系统验证通过→提升；失败→固化 Finding"
  - from: product
    to: [design, backend-design, frontend-design]
    condition: "按 Story/PRD 真实影响面选择：UI 行为→design+frontend-design，后端/数据/集成→backend-design；fullstack 不代表三者全部必选"
  - from: design
    to: [frontend-design]
    condition: "design 完成"
  - from: [backend-design, frontend-design]
    to: [code]
    condition: "方案完成"
  - from: code
    to: [test-case-gen]
    condition: "Step 3 REVIEW 通过"
  - from: test-case-gen
    to: [quality]
    condition: "harness.yml.walkthrough_env=development：测试用例生成完成后直接 quality"
  - from: test-case-gen
    to: [build-image]
    condition: "harness.yml.walkthrough_env=test：先构建不可变镜像，再部署 Test 环境"
  - from: promote-test
    to: [integration]
    condition: "harness.yml.walkthrough_env=test：Test 部署健康后进行真实环境集成处理与验证"
  - from: integration
    to: [quality]
    condition: "harness.yml.walkthrough_env=test：环境集成完成后执行 quality"
  - from: quality
    to: [product-acceptance]
    condition: "达标（≥ 阈值，由 harness.yml.gates.quality_threshold 决定）→ product-acceptance"
    # 不达标：回退对应 code 任务状态为 in-progress，重新执行（见 SPRINT.md 质量回退协议）
  - from: product-acceptance
    to: [product, code, sprint-close]
    condition: "需求变化/新 Story→回退 product 及下游并 amend；实现缺陷/非产品问题→code；通过→先归档 Sprint 元数据"
  - from: sprint-close
    to: [pr]
    condition: "归档计划和项目指针已纳入 sprint 分支"
  - from: pr
    to: []
    condition: "PR 已合并且 worktree 安全清理，Sprint 闭环结束"

  # ─── deploy-sprint 流转（H-OPT v1.6：发布作为独立 Sprint，无 worktree）─────
  # 触发：feature-sprint pr 完成合并与安全清理 + 项目要求 promote 到 test/prod。
  # deploy-sprint 任务集（test）：build-image → promote-test（自动 Preflight）→ integration
  # deploy-sprint 任务集（prod）：上述 + release-prep → migration-design+regression → release-approval(L3) → prod-deploy → back-merge → observe
  - from: pr
    to: [build-image]
    condition: "显式启动独立 deploy-sprint-test；不创建 worktree"
  - from: build-image
    to: [promote-test]
    condition: ".harness/state/build-image-<N-name>.json success=true（test 链路）"
  - from: promote-test
    to: [integration]
    condition: "Test deploy 状态 success=true、readiness=passed、smoke=passed 后"
  - from: integration
    to: [release-prep]
    condition: "若 deploy-sprint 目标=prod，则进入 release 链路；否则 deploy-sprint 结束"
  - from: release-prep
    to: [migration-design, regression]
    condition: "并行：迁移设计 + 全量回归"
  - from: [migration-design, regression]
    to: [release-approval]
    condition: "两者均通过"
  - from: release-approval
    to: [prod-deploy]
    condition: "Boss approve"
  - from: prod-deploy
    to: [back-merge, observe]
    condition: "健康窗口通过"
  - from: hotfix-init
    to: [code]
    condition: "在 hotfix/<issue-id> worktree 内继续 sprint 任务流"
  - from: code
    to: [back-merge]
    condition: "hotfix 已合并 main 且部署成功"
